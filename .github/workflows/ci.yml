name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

# Third-party actions are pinned to commit SHAs (tag in the comment); Dependabot
# (.github/dependabot.yml) proposes updates.
permissions:
  contents: read

# One deploy at a time; a newer push waits rather than racing an older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.13.9"
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy scripts src tests
      - run: uv run pytest -q
      - name: Shell scripts parse
        run: for f in scripts/*.sh; do bash -n "$f"; done

  image:
    name: Build and push image
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: TURF_COMMIT=${{ github.sha }}
          # One immutable tag per commit (what deploys use), plus a moving "main".
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production
    needs: image
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://turf.dunkasaur.gg
    permissions:
      contents: read
      packages: read
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy (server pulls this commit's image, health-checks, rolls back on failure)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The key's forced command only accepts "deploy <sha>"; the job token
          # goes over stdin for a single pull and expires when this job ends.
          printf '%s\n%s\n' "$REGISTRY_USER" "$REGISTRY_TOKEN" \
            | ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" -o BatchMode=yes \
                "turfdeploy@$DEPLOY_HOST" "deploy $GITHUB_SHA"
      - name: Smoke test the public URL
        run: |
          set -euo pipefail
          base=https://turf.dunkasaur.gg
          curl -sf --retry 5 --retry-delay 3 --retry-all-errors "$base/healthz"
          meta="$(curl -sf --retry 5 --retry-delay 3 --retry-all-errors "$base/api/meta")"
          echo "$meta"
          jq -e --arg sha "$GITHUB_SHA" '.commit == $sha' <<<"$meta"
          curl -sf "$base/api/chains/search?q=starbucks" | jq -e '.[0].chain_key == "starbucks"'
          curl -sf -X POST "$base/api/targets" -H 'content-type: application/json' \
            -d '{"chain_key":"orangetheory fitness","states":["TX"]}' | jq -e '.targets | length > 0'
