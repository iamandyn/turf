# Installed to /opt/turf/docker-compose.yml on the server by scripts/setup_server.sh.
# The image tag (one per commit, built by CI) lives in /opt/turf/state/.env and is
# switched by scripts/server_deploy.sh. Data is mounted read-only from the release
# that /opt/turf/data/current points at (scripts/deploy_data.sh).
services:
  turf:
    image: ${TURF_IMAGE:?TURF_IMAGE is set in /opt/turf/state/.env}
    container_name: turf
    restart: unless-stopped
    ports:
      # Localhost only: Caddy on the host is the only way in.
      - "127.0.0.1:8090:8000"
    volumes:
      - /opt/turf/data/current:/data:ro
    # Keep Turf from crowding out the other sites on this box.
    mem_limit: 4g
    cpus: 2
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
