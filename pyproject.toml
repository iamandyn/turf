[project]
name = "turf"
version = "0.1.0"
description = "Ad-ready geo-conquesting target lists from Overture Maps data."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[dependency-groups]
# Offline data pipeline only (DuckDB Python functions need numpy); not in the API image.
pipeline = [
    "numpy>=2.5.5",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "httpx>=0.27",
    "playwright>=1.65.2",
    "axe-playwright-python>=0.1.8",
]

[tool.uv]
# Local `uv sync` / `uv run` get everything; the Docker image opts out of both groups.
default-groups = ["dev", "pipeline"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/turf_app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Test data tables read better one row per line.
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
# No type information shipped; only the browser smoke script uses it.
module = ["axe_playwright_python.*"]
ignore_missing_imports = true
